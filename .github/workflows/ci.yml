name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # No submodules: `repos/` vendors Alchemy and Effect for local reference only.
      # Nothing in typecheck/lint/test/build reads it, and a recursive clone drags in
      # kubernetes, expo, azure-rest-api-specs, and aws-sdk-js-v3.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
